name: APK Android de test

# Construit un APK installable directement sur un téléphone Android (sans compte Expo).
# - Sans « api_url » : mode démo (backend simulé, OTP 123456, PIN 1234).
# - Avec « api_url » : l'app parle à l'API DALA déployée à cette adresse.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API DALA (laisser vide pour le mode démo)"
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['apps/mobile/**', 'packages/shared/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      # Pas d'envoi des source maps vers Sentry depuis la CI de test.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Génère le projet Android natif
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Compile l'APK (release signé avec la clé de debug)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Renomme l'APK
        run: |
          mode=$([ -n "$EXPO_PUBLIC_API_URL" ] && echo "api" || echo "demo")
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "DALA-Finance-${mode}-${GITHUB_SHA::7}.apk"
          ls -la *.apk
          echo "APK_NAME=$(ls DALA-Finance-*.apk)" >> "$GITHUB_ENV"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt dump badging DALA-Finance-*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
      - uses: actions/upload-artifact@v4
        with:
          name: DALA-Finance-apk
          path: DALA-Finance-*.apk
          retention-days: 30

  # Installe l'APK sur un émulateur et déroule le parcours de connexion démo.
  smoke-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DALA-Finance-apk
      - name: Active KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r DALA-Finance-*.apk
            python3 apps/mobile/e2e/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-emulateur
          path: smoke-shots

  # Publie l'APK validé dans une pré-version « test » (lien direct, sans zip).
  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DALA-Finance-apk
      - name: Met à jour la pré-version de test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete test-android --yes --cleanup-tag || true
          gh release create test-android DALA-Finance-*.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "DALA Finance — APK de test (${GITHUB_SHA::7})" \
            --notes "APK Android de test, validé sur émulateur (connexion démo → accueil). Mode démo : OTP 123456, PIN 1234. Guide : docs/TEST-TERRAIN.md"
