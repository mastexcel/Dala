name: APK Android de test

# Construit un APK installable directement sur un téléphone Android (sans compte Expo).
# - Sans « api_url » : mode démo (backend simulé, OTP 123456, PIN 1234).
# - Avec « api_url » : l'app parle à l'API DALA déployée à cette adresse.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API DALA (laisser vide pour le mode démo)"
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['apps/mobile/**', 'packages/shared/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      # Sans URL d'API : APK de démonstration (données fictives). Avec une URL : version reliée à l'API.
      EXPO_PUBLIC_DEMO_MODE: ${{ inputs.api_url == '' && 'true' || 'false' }}
      # Numéro de version intégré à l'app : sert à détecter une mise à jour disponible.
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      # Pas d'envoi des source maps vers Sentry depuis la CI de test.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Numéro de version croissant (mise à jour propre de l'app déjà installée)
        working-directory: apps/mobile
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          grep -n versionCode app.json
      - name: Génère le projet Android natif
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Compile l'APK (release signé avec la clé de debug)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      # Deux fichiers issus de la même compilation :
      # - l'APK téléphone, sans le code x86 (inutile sur téléphone, il doublait presque la taille) ;
      # - l'APK émulateur (x86_64 inclus), réservé au test automatique.
      - name: Prépare l'APK téléphone (ARM uniquement) et l'APK émulateur
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mode=$([ -n "$EXPO_PUBLIC_API_URL" ] && echo "api" || echo "demo")
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p emulator && cp "$SRC" "emulator/DALA-Finance-emulateur-${GITHUB_SHA::7}.apk"
          cp "$SRC" phone-unsigned.apk
          zip -q -d phone-unsigned.apk 'lib/x86/*' 'lib/x86_64/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
          "$BT/zipalign" -p -f 4 phone-unsigned.apk phone-aligned.apk
          # Même clé que les versions précédentes : l'APK s'installe par-dessus l'app déjà présente.
          "$BT/apksigner" sign --ks apps/mobile/android/app/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out "DALA-Finance-${mode}-${GITHUB_SHA::7}.apk" phone-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs DALA-Finance-*.apk | grep -E "Verified|SHA-256"
          "$BT/aapt" dump badging DALA-Finance-*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          ls -la DALA-Finance-*.apk emulator/
          # Garde-fou : un APK téléphone trop lourd ne passe pas par toutes les messageries.
          size=$(stat -c %s DALA-Finance-*.apk)
          [ "$size" -lt 80000000 ] || { echo "::error::APK téléphone trop lourd ($size octets)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: DALA-Finance-apk
          path: DALA-Finance-*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DALA-Finance-apk-emulateur
          path: emulator/*.apk
          retention-days: 7

  # Installe l'APK sur un émulateur et déroule le parcours de connexion démo.
  smoke-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DALA-Finance-apk-emulateur
      - name: Active KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r DALA-Finance-emulateur-*.apk
            python3 apps/mobile/e2e/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-emulateur
          path: smoke-shots

  # Publie l'APK validé dans une pré-version « test » (lien direct, sans zip).
  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DALA-Finance-apk
      - name: Met à jour la pré-version de test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Lien permanent (DALA-Finance.apk) + fiche de version lue par l'app pour proposer la mise à jour.
          cp DALA-Finance-*.apk DALA-Finance.apk
          printf '{"versionCode": %s, "commit": "%s", "publishedAt": "%s", "url": "https://github.com/%s/releases/download/test-android/DALA-Finance.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" > version.json
          cat version.json
          gh release delete test-android --yes --cleanup-tag || true
          gh release create test-android DALA-Finance-*.apk DALA-Finance.apk version.json \
            --target "${{ github.sha }}" --prerelease \
            --title "DALA Finance — APK de test (${GITHUB_SHA::7})" \
            --notes "APK Android de test, validé sur émulateur (connexion démo → accueil). Mode démo : OTP 123456, PIN 1234. Guide : docs/TEST-TERRAIN.md"
