name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dala
          POSTGRES_PASSWORD: dala
          POSTGRES_DB: dala_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dala:dala@localhost:5432/dala_test
      TEST_DATABASE_URL: postgresql://dala:dala@localhost:5432/dala_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @dala/shared
      - run: npm test -w @dala/shared
      - name: API — migrations, typecheck, tests
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx tsc --noEmit
          npx vitest run
          npm run test:integration
      - name: Mobile — typecheck & bundle
        working-directory: apps/mobile
        run: |
          npx tsc --noEmit
          npx expo export --platform android --output-dir /tmp/dist-check

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/mobile/test-results

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml-scoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/ml-scoring/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
